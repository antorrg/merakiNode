<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Splash</title>
  <style>
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
}

.splash {
  width: 100vw;
  height: 100vh;
  box-sizing: border-box;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #154dc7;
  color: white;

  border: 5px solid rgba(255, 255, 255, 0.15);
  border-radius: 8px;

  overflow: hidden;

  box-shadow:
    inset 0 0 0 2px rgba(255, 255, 255, 0.25),
    inset 0 0 10px rgba(0, 0, 0, 0.35);
}

    .box {
      text-align: center;
    }

    .title {
      font-size: 24px;
      margin-bottom: 12px;
    }

    .text {
      font-size: 10px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="splash">
  <div class="box">
  <div class="title">Meraki</div>
  <div class="title">Centro Integral</div>
  <ul id="logs"></ul>
</div>
</div>

<script>
  const logs = document.getElementById('logs')

  window.splashApi.onStartupLog((message) => {
    const li = document.createElement('li')
    li.textContent = message
    logs.appendChild(li)
  })
</script>
</body>
</html>
